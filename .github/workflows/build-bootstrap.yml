# Builds the runtime bootstrap archive for org.codirex.webide from the Termux package sources.
#
# Run it manually from the Actions tab (takes about 3.5 hours). Artifacts:
#   bootstrap-full  the archive exactly as the Termux script produced it (uploaded right away)
#   debs            every package built for org.codirex.webide (raw material for an apt repository)
#   bootstrap       the smaller archive (only what the app needs) plus the build logs
#
# If something goes wrong after the long build, the "Prune bootstrap" workflow can redo the
# small part from bootstrap-full in a few minutes, without rebuilding.
#
# Tip: run it once with preflight_only = true first. It checks in about 3 minutes that the
# build container can write its output, so a permission problem does not cost 3.5 hours.
name: Build bootstrap

on:
  workflow_dispatch:
    inputs:
      termux_packages_ref:
        description: termux-packages branch, tag or commit (its main branch is called master)
        default: master
      architectures:
        description: Architectures, comma separated (aarch64, arm, x86_64, i686)
        default: aarch64
      extra_packages:
        description: Extra packages added to the base bootstrap, comma separated
        default: nodejs,git
      preflight_only:
        description: Only run the quick checks (about 3 minutes), skip the long build
        type: boolean
        default: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this project
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref }}
          path: termux-packages

      - name: Set the package name
        working-directory: termux-packages
        shell: bash
        run: |
          echo "Lines in scripts/properties.sh that mention com.termux:"
          grep -n 'com\.termux' scripts/properties.sh || true
          # Older checkouts call the variable TERMUX_APP_PACKAGE, newer ones TERMUX_APP__PACKAGE_NAME.
          sed -i -E 's/^(TERMUX_APP_PACKAGE|TERMUX_APP__PACKAGE_NAME)="com\.termux"/\1="org.codirex.webide"/' scripts/properties.sh
          echo "After the change:"
          grep -nE '^(TERMUX_APP_PACKAGE|TERMUX_APP__PACKAGE_NAME)=' scripts/properties.sh || true
          if ! grep -qE '^(TERMUX_APP_PACKAGE|TERMUX_APP__PACKAGE_NAME)="org\.codirex\.webide"' scripts/properties.sh; then
            echo "::error::Could not set the package name. See the lines printed above."
            exit 1
          fi

      - name: Make the checkout writable for the build container
        working-directory: termux-packages
        shell: bash
        run: |
          # The container user is not the runner user. Without this, the last step of the
          # build (moving bootstrap-aarch64.zip into the checkout) fails with "Permission denied".
          chmod a+rwx .
          mkdir -p output
          chmod a+rwx output

      - name: Patch build-bootstraps.sh to write the archive into output/
        working-directory: termux-packages
        shell: bash
        run: |
          # The original script ends with `mv ... "$TERMUX_PACKAGES_DIRECTORY/"`. It does not check
          # the result and still prints "Finished successfully" when the mv fails, and then the
          # archive is deleted with its temp dir. Here the archive goes to output/ instead, a copy
          # is kept inside the container, and a failed mv stops the build with an error.
          python3 - <<'PY'
          import re, sys
          p = "scripts/build-bootstraps.sh"
          s = open(p).read()
          pattern = re.compile(
              r'^[ \t]*mv -f "\$\{BOOTSTRAP_TMPDIR\}/bootstrap-\$\{1\}\.zip" "\$TERMUX_PACKAGES_DIRECTORY/?"[ \t]*$',
              re.M)
          if len(pattern.findall(s)) != 1:
              print("::error::Could not find the final mv line in build-bootstraps.sh. Lines with mv:")
              for i, line in enumerate(s.splitlines(), 1):
                  if re.search(r'\bmv\b', line):
                      print(f"{i}: {line}")
              sys.exit(1)
          new = '''mkdir -p /home/builder/rescue "$TERMUX_PACKAGES_DIRECTORY/output"
          cp -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" /home/builder/rescue/
          if ! mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/output/"; then
            echo "[!] Could not move the archive into output/. A copy is in /home/builder/rescue" >&2
            exit 1
          fi'''.replace("\n          ", "\n")
          open(p, "w").write(pattern.sub(lambda m: new, s))
          print("Patched the final mv line.")
          PY
          grep -n 'rescue\|output/' scripts/build-bootstraps.sh

      - name: Let build-package.sh accept subpackage names
        working-directory: termux-packages
        shell: bash
        run: |
          # build-bootstraps.sh asks for some packages that are only subpackages of another
          # package (for example bzip2 is a part of libbz2) and fails on them.
          # Build the parent package instead. Upstream issue: termux/termux-packages#27093
          mv build-package.sh build-package.real.sh
          cat > build-package.sh <<'WRAPPER'
          #!/usr/bin/env bash
          set -e
          here="$(cd "$(dirname "$0")" && pwd)"
          args=()
          skip=0
          for arg in "$@"; do
            if [ "$skip" = 1 ]; then
              args+=("$arg")
              skip=0
              continue
            fi
            case "$arg" in
              -a|-o) args+=("$arg"); skip=1; continue ;;
              -*) args+=("$arg"); continue ;;
            esac
            if [ ! -f "$here/packages/$arg/build.sh" ]; then
              parent="$(ls "$here"/packages/*/"$arg".subpackage.sh 2>/dev/null | head -n1 | xargs -r dirname | xargs -r basename)"
              if [ -n "$parent" ]; then
                echo "build-package.sh wrapper: '$arg' is a subpackage of '$parent', building '$parent'" >&2
                arg="$parent"
              fi
            fi
            args+=("$arg")
          done
          exec "$here/build-package.real.sh" "${args[@]}"
          WRAPPER
          chmod +x build-package.sh

      - name: Preflight - can the archive get from the build container to the runner?
        working-directory: termux-packages
        shell: bash
        run: |
          {
            echo "runner: $(id)"
            ls -ld . output
            ./scripts/run-docker.sh bash -c '
              echo "container: $(id)"
              ls -ld /home/builder/termux-packages /home/builder/termux-packages/output
              findmnt -T /home/builder/termux-packages || true
              findmnt -T /home/builder/termux-packages/output || true
              head -c 30000000 /dev/zero > /tmp/pf-big.bin
              if mv -f /tmp/pf-big.bin /home/builder/termux-packages/output/pf-big.bin; then echo PF_C_OUTPUT_MV_OK; else echo PF_C_OUTPUT_MV_FAILED; fi
              if touch /home/builder/termux-packages/pf-root.txt; then echo PF_C_ROOT_OK; else echo PF_C_ROOT_FAILED; fi
              mkdir -p /home/builder/rescue && echo rescue > /home/builder/rescue/pf-rescue.txt && echo PF_C_RESCUE_OK
            ' 2>&1
            echo "--- what the runner sees afterwards"
            ls -la output pf-root.txt 2>&1 || true
            docker ps -a --format '{{.Names}}  {{.Status}}' || true
            if docker cp termux-package-builder:/home/builder/rescue/pf-rescue.txt ./pf-rescue.txt; then echo PF_H_DOCKER_CP_OK; else echo PF_H_DOCKER_CP_FAILED; fi
            if [ -s output/pf-big.bin ]; then echo PF_H_OUTPUT_VISIBLE; else echo PF_H_OUTPUT_NOT_VISIBLE; fi
            if [ -e pf-root.txt ]; then echo PF_H_ROOT_VISIBLE; else echo PF_H_ROOT_NOT_VISIBLE; fi
          } 2>&1 | tee preflight.log
          rm -f output/pf-big.bin pf-root.txt pf-rescue.txt || true
          if grep -q PF_C_OUTPUT_MV_OK preflight.log && { grep -q PF_H_OUTPUT_VISIBLE preflight.log || grep -q PF_H_DOCKER_CP_OK preflight.log; }; then
            echo "Preflight passed: the archive can leave the container."
          else
            echo "::error::The archive cannot get out of the build container this way. Send preflight.log (or this step's log)."
            exit 1
          fi

      - name: Preflight - simulate the archive hand-over
        if: ${{ inputs.preflight_only }}
        working-directory: termux-packages
        shell: bash
        run: |
          # Same commands as the patched end of build-bootstraps.sh, on a 30 MB dummy file.
          ./scripts/run-docker.sh bash -c '
            head -c 30000000 /dev/zero > /tmp/bootstrap-aarch64.zip
            mkdir -p /home/builder/rescue /home/builder/termux-packages/output
            cp -f /tmp/bootstrap-aarch64.zip /home/builder/rescue/
            if mv -f /tmp/bootstrap-aarch64.zip /home/builder/termux-packages/output/; then echo SIM_MV_OK; else echo SIM_MV_FAILED; fi
          ' 2>&1 | tee -a preflight.log

      - name: Upload the preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: termux-packages/preflight.log
          if-no-files-found: warn

      - name: Build bootstrap
        if: ${{ !inputs.preflight_only }}
        working-directory: termux-packages
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          ./scripts/run-docker.sh ./clean.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --architectures "$ARCHITECTURES" \
            --add "$EXTRA_PACKAGES" 2>&1 | tee build.log

      - name: Collect the archive (output/ or the copy inside the container)
        if: always()
        working-directory: termux-packages
        shell: bash
        run: |
          shopt -s nullglob
          # Note: with nullglob an unmatched pattern disappears, and a bare "ls" would list the
          # current directory and succeed. Count matches with an array instead.
          found=(bootstrap-*.zip)
          if [ ${#found[@]} -gt 0 ]; then
            echo "Archive is in the checkout:"
            ls -lh "${found[@]}"
            exit 0
          fi
          for z in output/bootstrap-*.zip; do
            echo "Found $z in output/"
            mv -f "$z" . || cp -f "$z" . || true
          done
          found=(bootstrap-*.zip)
          if [ ${#found[@]} -gt 0 ]; then
            ls -lh "${found[@]}"
            exit 0
          fi
          echo "Nothing in output/. Looking inside the container (it may already be gone)."
          docker ps -a --format '{{.Names}}  {{.Status}}' || true
          mkdir -p rescued
          docker cp termux-package-builder:/home/builder/rescue/. rescued/ || true
          for z in rescued/bootstrap-*.zip; do
            echo "Recovered $z from the container"
            mv -f "$z" . || true
          done
          found=(bootstrap-*.zip)
          if [ ${#found[@]} -gt 0 ]; then
            ls -lh "${found[@]}"
            exit 0
          fi
          echo "No archive found anywhere. Directory listing for the log:"
          ls -la . output || true

      - name: Keep the full archive
        if: always()
        working-directory: termux-packages
        shell: bash
        run: |
          for z in bootstrap-*.zip; do
            [ -e "$z" ] || continue
            case "$z" in *-full.zip) continue ;; esac
            mv "$z" "${z%.zip}-full.zip"
          done
          ls -lh bootstrap-*.zip || true

      - name: Upload the full archive right away
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-full
          path: |
            termux-packages/bootstrap-*-full.zip
            termux-packages/output/bootstrap-*.zip
          compression-level: 0
          if-no-files-found: warn

      - name: Pack the .deb packages
        if: ${{ always() && !inputs.preflight_only }}
        continue-on-error: true
        working-directory: termux-packages
        shell: bash
        run: |
          # Package file names contain ":" which artifact upload rejects, so pack them first.
          shopt -s nullglob
          debs=(output/*.deb)
          echo "${#debs[@]} packages"
          if [ ${#debs[@]} -gt 0 ]; then
            tar -cf debs.tar "${debs[@]}"
            ls -lh debs.tar
          fi

      - name: Upload the .deb packages
        if: ${{ always() && !inputs.preflight_only }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: termux-packages/debs.tar
          compression-level: 0
          if-no-files-found: warn

      - name: Fail if there is no archive
        if: always()
        working-directory: termux-packages
        shell: bash
        run: |
          if ! ls bootstrap-*-full.zip >/dev/null 2>&1; then
            echo "::error::The build did not produce a bootstrap archive."
            exit 1
          fi

      - name: Make the smaller archive
        if: ${{ !inputs.preflight_only }}
        continue-on-error: true
        working-directory: termux-packages
        shell: bash
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          # The Node.js package is built without npm, so add it from the npm registry.
          mkdir -p ../npm-download && (cd ../npm-download && npm pack "npm@11" --silent)
          tarball="$(ls ../npm-download/npm-*.tgz | head -n1)"
          shopt -s nullglob
          for z in bootstrap-*-full.zip; do
            small="${z%-full.zip}.small.zip"
            python3 ../repo/tools/prune_bootstrap.py "$z" "$small" --keep "$EXTRA_PACKAGES" | tee -a prune.log
            python3 ../repo/tools/add_npm.py "$small" "${z%-full.zip}.zip" "$tarball" | tee -a prune.log
            rm -f "$small"
          done
          ls -lh bootstrap-*.zip

      - name: Look for leftover com.termux paths
        if: ${{ always() && !inputs.preflight_only }}
        working-directory: termux-packages
        shell: bash
        run: |
          for zip in bootstrap-*.zip; do
            [ -e "$zip" ] || continue
            case "$zip" in *-full.zip) continue ;; esac
            dir="$(mktemp -d)"
            unzip -q "$zip" -d "$dir"
            echo "== $zip: files that still mention /data/data/com.termux"
            grep -rIl "/data/data/com.termux" "$dir" | head -50 || true
            grep -rl "/data/data/com.termux" "$dir" | wc -l
          done

      - name: Upload the smaller archive and logs
        if: ${{ always() && !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: |
            termux-packages/bootstrap-aarch64.zip
            termux-packages/bootstrap-arm.zip
            termux-packages/bootstrap-x86_64.zip
            termux-packages/bootstrap-i686.zip
            termux-packages/build.log
            termux-packages/prune.log
          if-no-files-found: warn
