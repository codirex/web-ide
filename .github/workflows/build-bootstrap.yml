# Builds the runtime bootstrap archive for org.codirex.webide from the Termux package sources.
#
# Run it manually from the Actions tab (takes about 3.5 hours). Artifacts:
#   bootstrap-full  the archive exactly as the Termux script produced it (uploaded right away)
#   bootstrap       the smaller archive (only what the app needs) plus the build logs
#
# If something goes wrong after the long build, the "Prune bootstrap" workflow can redo the
# small part from bootstrap-full in a few minutes, without rebuilding.
name: Build bootstrap

on:
  workflow_dispatch:
    inputs:
      termux_packages_ref:
        description: termux-packages branch, tag or commit (its main branch is called master)
        default: master
      architectures:
        description: Architectures, comma separated (aarch64, arm, x86_64, i686)
        default: aarch64
      extra_packages:
        description: Extra packages added to the base bootstrap, comma separated
        default: nodejs,git

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this project
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref }}
          path: termux-packages

      - name: Set the package name
        working-directory: termux-packages
        shell: bash
        run: |
          echo "Lines in scripts/properties.sh that mention com.termux:"
          grep -n 'com\.termux' scripts/properties.sh || true
          # Older checkouts call the variable TERMUX_APP_PACKAGE, newer ones TERMUX_APP__PACKAGE_NAME.
          sed -i -E 's/^(TERMUX_APP_PACKAGE|TERMUX_APP__PACKAGE_NAME)="com\.termux"/\1="org.codirex.webide"/' scripts/properties.sh
          echo "After the change:"
          grep -nE '^(TERMUX_APP_PACKAGE|TERMUX_APP__PACKAGE_NAME)=' scripts/properties.sh || true
          if ! grep -qE '^(TERMUX_APP_PACKAGE|TERMUX_APP__PACKAGE_NAME)="org\.codirex\.webide"' scripts/properties.sh; then
            echo "::error::Could not set the package name. See the lines printed above."
            exit 1
          fi

      - name: Make the checkout writable for the build container
        working-directory: termux-packages
        shell: bash
        run: |
          # The container user is not the runner user. Without this, the last step of the
          # build (moving bootstrap-aarch64.zip into the checkout) fails with "Permission denied".
          chmod a+rwx .
          mkdir -p output
          chmod a+rwx output

      - name: Let build-package.sh accept subpackage names
        working-directory: termux-packages
        shell: bash
        run: |
          # build-bootstraps.sh asks for some packages that are only subpackages of another
          # package (for example bzip2 is a part of libbz2) and fails on them.
          # Build the parent package instead. Upstream issue: termux/termux-packages#27093
          mv build-package.sh build-package.real.sh
          cat > build-package.sh <<'WRAPPER'
          #!/usr/bin/env bash
          set -e
          here="$(cd "$(dirname "$0")" && pwd)"
          args=()
          skip=0
          for arg in "$@"; do
            if [ "$skip" = 1 ]; then
              args+=("$arg")
              skip=0
              continue
            fi
            case "$arg" in
              -a|-o) args+=("$arg"); skip=1; continue ;;
              -*) args+=("$arg"); continue ;;
            esac
            if [ ! -f "$here/packages/$arg/build.sh" ]; then
              parent="$(ls "$here"/packages/*/"$arg".subpackage.sh 2>/dev/null | head -n1 | xargs -r dirname | xargs -r basename)"
              if [ -n "$parent" ]; then
                echo "build-package.sh wrapper: '$arg' is a subpackage of '$parent', building '$parent'" >&2
                arg="$parent"
              fi
            fi
            args+=("$arg")
          done
          exec "$here/build-package.real.sh" "${args[@]}"
          WRAPPER
          chmod +x build-package.sh

      - name: Build bootstrap
        working-directory: termux-packages
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          ./scripts/run-docker.sh ./clean.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --architectures "$ARCHITECTURES" \
            --add "$EXTRA_PACKAGES" 2>&1 | tee build.log

      - name: Rescue the archive if it is still inside the container
        if: always()
        working-directory: termux-packages
        shell: bash
        run: |
          if ls bootstrap-*.zip >/dev/null 2>&1; then
            echo "Archive is in the checkout."
            exit 0
          fi
          echo "No archive in the checkout; looking inside the container."
          docker ps -a --format '{{.Names}}' || true
          found="$(docker exec termux-package-builder find / -xdev -name 'bootstrap-*.zip' -size +5M 2>/dev/null | head -n 5 || true)"
          echo "found: $found"
          for f in $found; do
            docker cp "termux-package-builder:$f" . || true
          done
          ls -lh bootstrap-*.zip || true

      - name: Keep the full archive
        if: always()
        working-directory: termux-packages
        shell: bash
        run: |
          for z in bootstrap-*.zip; do
            [ -e "$z" ] || continue
            case "$z" in *-full.zip) continue ;; esac
            mv "$z" "${z%.zip}-full.zip"
          done
          ls -lh bootstrap-*.zip || true

      - name: Upload the full archive right away
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-full
          path: termux-packages/bootstrap-*-full.zip
          compression-level: 0
          if-no-files-found: warn

      - name: Make the smaller archive
        continue-on-error: true
        working-directory: termux-packages
        shell: bash
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          for z in bootstrap-*-full.zip; do
            [ -e "$z" ] || continue
            python3 ../repo/tools/prune_bootstrap.py "$z" "${z%-full.zip}.zip" --keep "$EXTRA_PACKAGES" | tee -a prune.log
          done
          ls -lh bootstrap-*.zip

      - name: Look for leftover com.termux paths
        if: always()
        working-directory: termux-packages
        shell: bash
        run: |
          for zip in bootstrap-*.zip; do
            [ -e "$zip" ] || continue
            case "$zip" in *-full.zip) continue ;; esac
            dir="$(mktemp -d)"
            unzip -q "$zip" -d "$dir"
            echo "== $zip: files that still mention /data/data/com.termux"
            grep -rIl "/data/data/com.termux" "$dir" | head -50 || true
            grep -rl "/data/data/com.termux" "$dir" | wc -l
          done

      - name: Upload the smaller archive and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: |
            termux-packages/bootstrap-aarch64.zip
            termux-packages/bootstrap-arm.zip
            termux-packages/bootstrap-x86_64.zip
            termux-packages/bootstrap-i686.zip
            termux-packages/build.log
            termux-packages/prune.log
          if-no-files-found: warn
