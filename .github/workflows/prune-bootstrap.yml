# Makes the final bootstrap archive from the full one produced by an earlier "Build bootstrap" run:
# removes build-time packages and adds npm. Takes a few minutes; no package is rebuilt.
name: Prune bootstrap

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of a finished "Build bootstrap" run (the number at the end of its URL)
        required: true
      extra_packages:
        description: Extra packages to keep, comma separated
        default: nodejs,git
      npm_version:
        description: npm version or range to add (the Node.js package was built without npm)
        default: "11"

permissions:
  contents: read
  actions: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Download the full archive
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-full
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: full

      - name: Download npm
        shell: bash
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          mkdir -p npm-download
          cd npm-download
          npm pack "npm@${NPM_VERSION}" --silent
          ls -lh

      - name: Prune and add npm
        shell: bash
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          mkdir -p out work
          tarball="$(ls npm-download/npm-*.tgz | head -n1)"
          for z in full/bootstrap-*-full.zip; do
            name="$(basename "$z")"
            small="work/${name%-full.zip}.zip"
            python3 tools/prune_bootstrap.py "$z" "$small" --keep "$EXTRA_PACKAGES"
            python3 tools/add_npm.py "$small" "out/${name%-full.zip}.zip" "$tarball"
          done
          ls -lh full out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-pruned
          path: out/*.zip
