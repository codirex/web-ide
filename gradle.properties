org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Shared SDK levels, read by every module build script.
# targetSdk stays at 28 on purpose: apps targeting 29+ cannot exec() files
# from their own data directory (see docs/ARCHITECTURE.md).
# If platform 37 is not installed in your SDK, lower webide.compileSdk to 36.
webide.compileSdk=37
webide.minSdk=26
webide.targetSdk=28
